name: Update secondary contact label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-secondary-number.yml'

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace India label with Secondary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'India: +91 99618 89495'
          new = 'Secondary: +91 99618 89495'
          if old not in s:
              raise SystemExit('Expected contact label not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Present India contact as secondary number'
          git push
