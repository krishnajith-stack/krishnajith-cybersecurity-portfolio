name: Add WhatsApp floating chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-whatsapp-float.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add floating WhatsApp button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'class="whatsapp-float"' in s:
              print('WhatsApp floating button already present; no change needed.')
          else:
              css = '.whatsapp-float{position:fixed;right:22px;bottom:22px;z-index:50;display:inline-flex;align-items:center;gap:9px;padding:12px 16px;border-radius:999px;background:#fff;color:#07111f;font-weight:850;box-shadow:0 12px 32px #0008;border:1px solid #ffffff33;transition:transform .18s ease,box-shadow .18s ease}.whatsapp-float:hover{transform:translateY(-2px);box-shadow:0 16px 36px #0009}.whatsapp-float svg{width:20px;height:20px;flex:0 0 auto}@media(max-width:650px){.whatsapp-float{right:14px;bottom:14px;padding:11px 13px}.whatsapp-float .wa-label{display:none}.whatsapp-float svg{width:22px;height:22px}}'
              if '</style>' not in s:
                  raise SystemExit('Could not find </style> marker')
              s = s.replace('</style>', css + '</style>', 1)
              button = '<a class="whatsapp-float" href="https://wa.me/971521259119?text=Hi%20Krishnajith%2C%20I%20came%20across%20your%20cybersecurity%20portfolio%20and%20would%20like%20to%20connect%20regarding%20an%20opportunity." target="_blank" rel="noopener" aria-label="Chat with Krishnajith on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5A8.48 8.48 0 0 1 21 11v.5z"/></svg><span class="wa-label">Chat on WhatsApp</span></a>'
              if '</body>' not in s:
                  raise SystemExit('Could not find </body> marker')
              s = s.replace('</body>', button + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add floating WhatsApp chat button"
          git push
