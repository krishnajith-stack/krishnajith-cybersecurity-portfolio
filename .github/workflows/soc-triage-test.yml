name: Test SOC L1 triage automation

on:
  push:
    paths:
      - "soc-l1-alert-triage-automation/**"
      - ".github/workflows/soc-triage-test.yml"
  pull_request:
    paths:
      - "soc-l1-alert-triage-automation/**"
      - ".github/workflows/soc-triage-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-l1-alert-triage-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run sample triage
        run: python triage.py --input samples/alert-powershell.json --output-dir reports
