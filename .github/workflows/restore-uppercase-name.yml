name: Restore uppercase portfolio name
on:
  push:
    paths:
      - '.github/workflows/restore-uppercase-name.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore uppercase visible name
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a class="logo" href="#top">Krishnajith</a>', '<a class="logo" href="#top">KRISHNAJITH</a>')
          s = s.replace('<h1>Krishnajith<span>', '<h1>KRISHNAJITH<span>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Restore KRISHNAJITH uppercase in portfolio header'
            git push
          fi
