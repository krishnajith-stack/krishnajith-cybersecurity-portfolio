name: Make primary contact callable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-primary-number-callable.yml'

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace WhatsApp contact link with phone link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="https://wa.me/971521259119" target="_blank" rel="noopener">Connect with me: +971 52 125 9119</a>'
          new = '<a href="tel:+971521259119">Connect with me: +971 52 125 9119</a>'
          if old not in s:
              raise SystemExit('Expected contact link not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make primary contact number callable"
          git push
