[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-l1-alert-triage-automation"
version = "1.0.0"
description = "Transparent SOC L1 alert enrichment, scoring, and escalation automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Krishnajith P U"}]
dependencies = []

[project.scripts]
soc-triage = "soc_triage.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
